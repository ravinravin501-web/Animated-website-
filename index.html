<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ravin Tech Solution</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
overflow:hidden;
color:white;
}

/* INTRO VIDEO */

#intro{
position:fixed;
inset:0;
z-index:9999;
background:#000;
animation:hideIntro 8s forwards;
}

#intro video{
width:100%;
height:100%;
object-fit:cover;
}

@keyframes hideIntro{
0%,85%{
opacity:1;
visibility:visible;
}
100%{
opacity:0;
visibility:hidden;
}
}

/* MAIN */

.main{
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
radial-gradient(circle at top,#0d1d55,#000 60%);
overflow:hidden;
position:relative;
}

/* LAPTOP */

.laptop{
width:900px;
max-width:95%;
height:520px;
background:#05070f;
border-radius:25px;
padding:18px;
border:5px solid #111;
box-shadow:
0 0 60px #006eff,
0 0 120px #003cff;
position:relative;
transform:perspective(1500px) rotateX(8deg);
}

/* SCREEN */

.screen{
width:100%;
height:100%;
border-radius:18px;
overflow:hidden;
position:relative;
background:
linear-gradient(135deg,#020817,#071c45,#020817);
}

/* TOP BAR */

.topbar{
height:60px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 25px;
border-bottom:1px solid rgba(255,255,255,.1);
}

.logo{
font-size:24px;
font-weight:bold;
letter-spacing:2px;
text-shadow:0 0 15px #00aeff;
}

.nav{
display:flex;
gap:12px;
}

.nav button{
padding:10px 18px;
border:none;
border-radius:25px;
background:#0c1533;
color:white;
border:1px solid #1b66ff;
cursor:pointer;
}

/* CONTENT */

.content{
height:calc(100% - 60px);
display:flex;
justify-content:space-around;
align-items:center;
padding:40px;
}

/* LEFT */

.left{
max-width:420px;
}

.left h1{
font-size:65px;
line-height:1;
text-transform:uppercase;
margin-bottom:25px;
text-shadow:0 0 30px #5fbfff;
}

.left h1 span{
color:#7ec8ff;
}

.left p{
font-size:17px;
line-height:1.7;
color:#d7e6ff;
margin-bottom:30px;
}

.btn{
display:inline-block;
padding:16px 35px;
border-radius:40px;
background:#0077ff;
color:white;
text-decoration:none;
font-weight:bold;
box-shadow:0 0 30px #0077ff;
}

/* RIGHT CIRCLE */

.circle{
width:260px;
height:260px;
border-radius:50%;
border:16px solid rgba(255,255,255,.2);
border-top:16px solid #fff;
box-shadow:
0 0 40px #78c6ff,
inset 0 0 25px #78c6ff;
animation:spin 5s linear infinite;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

/* FLOATING LIGHT */

.light{
position:absolute;
width:400px;
height:400px;
background:#0051ff55;
filter:blur(100px);
border-radius:50%;
top:-100px;
right:-100px;
}

/* LAPTOP BASE */

.base{
position:absolute;
bottom:-35px;
left:50%;
transform:translateX(-50%);
width:105%;
height:40px;
background:#0f0f0f;
border-radius:0 0 30px 30px;
box-shadow:0 15px 30px rgba(0,0,0,.8);
}

/* MOBILE */

@media(max-width:768px){

.laptop{
height:90vh;
transform:none;
}

.content{
flex-direction:column;
text-align:center;
gap:40px;
padding:25px;
}

.left h1{
font-size:42px;
}

.circle{
width:180px;
height:180px;
}

}

</style>
</head>

<body>

<!-- INTRO VIDEO -->

<section id="intro">

<video autoplay muted playsinline>
<source src="intro.mp4" type="video/mp4">
</video>

</section>

<!-- WEBSITE -->

<div class="main">

<div class="light"></div>

<div class="laptop">

<div class="screen">

<div class="topbar">

<div class="logo">
RAVIN TECH
</div>

<div class="nav">
<button>Home</button>
<button>Services</button>
<button>Contact</button>
</div>

</div>

<div class="content">

<div class="left">

<h1>
Creating<br>
Digital<br>
<span>Experience</span>
</h1>

<p>
Premium futuristic websites, AI designs,
cyber security concepts, ethical hacking,
branding and modern digital solutions.
</p>

<a class="btn"
href="https://wa.me/919042458779">
Start Project
</a>

</div>

<div class="circle"></div>

</div>

</div>

<div class="base"></div>

</div>

</div>

</body>
</html>
